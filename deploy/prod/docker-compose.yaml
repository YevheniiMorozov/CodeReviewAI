version: "3.8"


volumes:
  data-redis:


services:

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ../../data-redis:/data
    command: redis-server --save 20 1 --loglevel warning
    logging:
      options:
        max-file: "5"
        max-size: "5m"
  web:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    restart: always
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    depends_on:
      - redis
